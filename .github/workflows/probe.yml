name: Prueba conector UGR (temporal)
on:
  push:
    branches: [claude/zen-archimedes-p0y0ak]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r scrapers/requirements.txt
      - run: python -m unittest discover -s scrapers/tests -t .
      - run: python -m scrapers.run && head -c 600 data/granada/events.json
