name: Prueba acceso granada.org (temporal)
on:
  push:
    branches: [claude/zen-archimedes-p0y0ak]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="AgendaliaBot/0.1 (+https://beacruzmo9.github.io/agenda-eventos/)"
          for u in https://www.granada.org/robots.txt "https://www.granada.org/inet/wagenda.nsf/wwtap!OpenView&ExpandView"; do
            echo "== $u"; curl -sS -A "$UA" -m 30 -o out.html -w "HTTP %{http_code}\n" "$u" || true; head -c 3000 out.html; echo
          done
