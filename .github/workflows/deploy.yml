name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch: # botón "Run workflow" para lanzarlo a mano
  schedule:
    - cron: '0 4 * * *' # cada día a las 04:00 UTC (05:00/06:00 en España)

permissions:
  contents: write # para guardar en el repo los datos recogidos cada día
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1) Recoger eventos de las fuentes (Python)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scrapers/requirements.txt
      - run: pip install -r scrapers/requirements.txt
      - name: Pruebas de los conectores
        run: python -m unittest discover -s scrapers/tests -t .
      - name: Recoger eventos
        # Si una fuente falla se conservan sus últimos datos buenos y la web se publica igualmente.
        continue-on-error: true
        run: python -m scrapers.run
      - name: Guardar datos en el repositorio
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "ciudadenvivo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Sin cambios en los datos"; else
            git commit -m "Datos: actualización automática $(date -u +%F)"
            git push
          fi

      # 2) Construir la web (Astro)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
